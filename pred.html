<!DOCTYPE html>
<html>
<head>
  <title>Iris Classification App</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
    }
    h1 {
      background-color: DodgerBlue;
      color: white;
      padding: 10px;
    }
    p {
      background-color: Orange;
      padding: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
      background-color: Tomato;
      padding: 5px;
      color: white;
    }
    input[type="number"] {
      background-color: DodgerBlue;
      color: white;
      border: none;
      padding: 10px;
      margin: 5px 0;
      width: 300px;
    }
    input[type="submit"] {
      background-color: DodgerBlue;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Iris Classification App</h1>
  <p>Enter flower measurements to classify the Iris species (Using Decision tree)</p>

  <form action="/" method="POST">
    <label for="sepal_length">Enter Sepal Length (cm):</label>
    <input type="number" step="0.1" id="sepal_length" name="sepal_length" required>

    <label for="sepal_width">Enter Sepal Width (cm):</label>
    <input type="number" step="0.1" id="sepal_width" name="sepal_width" required>

    <label for="petal_length">Enter Petal Length (cm):</label>
    <input type="number" step="0.1" id="petal_length" name="petal_length" required>

    <label for="petal_width">Enter Petal Width (cm):</label>
    <input type="number" step="0.1" id="petal_width" name="petal_width" required>

    <input type="submit" value="Classify">
  </form>

</body>
</html>
